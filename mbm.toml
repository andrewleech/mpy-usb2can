# micropython-branch-manager (mbm)
# Install: pip install micropython-branch-manager
#          or: uv tool install micropython-branch-manager
# Usage:   mbm --help

[[submodules]]
path = "src/micropython"
integration_branch = "usb2can-integration"
branches = [
    { name = "feature/usbd-runtime-vendor-control" },
    { name = "feature/stm32-h5-fdcan" },
    { name = "feature/usbd-bos-descriptor" },
    { name = "feature/stm32-can-rxbuf" },
    { name = "feature/stm32-can-rx-ordering" },
    { name = "feature/usbd-xfer-queue" },
    { name = "feature/stm32-sched-wfe" },
]

[[submodules]]
path = "src/libs/micropython-lib"
integration_branch = "feature/usbd-xfer-queue"
branches = [
    { name = "feature/usbd-xfer-queue" },
]
