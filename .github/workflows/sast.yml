name: SAST

# C static analysis: cppcheck and CodeChecker's Clang Static Analyzer over every translation unit of
# every agreed configuration on every run, plus, off pull requests, GCC -fanalyzer on the ARM
# configurations and cppcheck's MISRA addon. Each analysis job runs the Makefile's targets in the
# build image, pinned by digest, the same commands a developer runs locally (CLAUDE.md, Static
# analysis), and fails when a tool is missing, a compilation database is empty or incomplete, or
# cppcheck or CodeChecker could not analyse a unit outside analysis/coverage-gaps.json.
#
# -fanalyzer and MISRA are report-only. MISRA over every unit runs to tens of thousands of results,
# more than code scanning accepts in one run (25,000), so its results stay in that job's artefact,
# and the upload does not wait for it.
#
# CodeChecker runs the Clang Static Analyzer at the releases GitLab Advanced SAST's C/C++ job runs
# (CodeChecker 6.25.1, clang 20.1.8) with that job's default checkers. For the host configurations
# its results are what that job would report for the same database; for the ARM configurations they
# are not, since GitLab's analyzer image has no arm-none-eabi-gcc for CodeChecker to take the
# target from.
#
# Nothing in this workflow decides whether a finding blocks a merge. The upload job sends each
# configuration's SARIF to code scanning under its own category, cppcheck/<configuration>,
# codechecker/<configuration> and gcc-analyzer/<configuration>, and the repository ruleset's code
# scanning rule (required tool Cppcheck, security alerts High or higher, other alerts None) fails a
# pull request on a new alert at cppcheck's own security-severity of 8.5 or 9.9. CodeChecker's
# SARIF carries no security-severity, so its alerts are not security alerts and do not gate.
# Merge protection only acts on alerts whose lines are all in the pull request's diff
# (https://docs.github.com/en/code-security/concepts/code-scanning/merge-protection), so findings
# in submodule code and in the build directory's generated code are uploaded and visible but never
# block here. The ruleset is a repository setting, not code; the gh api command that creates it is
# in CLAUDE.md.
#
# The analysis tools are not in this repository. `make sast-tools` installs them from SAST_TOOLS,
# a pip requirement for the degraves-sast package, which comes from the repository variable of the
# same name, a local path or a VCS URL pinned to a commit. There is no default: an unset variable
# fails every analysis job at its first step.
#
# The container is pinned by digest, the same image as the Makefile's IMAGE and .gitlab-ci.yml, and
# the digest is part of the tools cache key, because cppcheck is built in and for that image and the
# analysis derives its predefines from that image's compilers. A job's container cannot read the
# workflow's env, so the digest is written out in each job; change them together. The analysers'
# versions, the Makefile's own pins restated, are in the key too.

on:
  pull_request:
  push:
    branches: [main, sast]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CPPCHECK_VERSION: 2.22.0
  ARM_GCC_ANALYZER_VERSION: 15.2.rel1
  CODECHECKER_VERSION: 6.25.1
  LLVM_VERSION: 20.1.8
  IMAGE_DIGEST: sha256:0d80e3aaa94bcc5d268d1ec92e3d19865e17d68d3bc9328f0051b5fb0dde007b

jobs:
  analyse:
    name: ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    container: micropython/build-micropython-arm@sha256:0d80e3aaa94bcc5d268d1ec92e3d19865e17d68d3bc9328f0051b5fb0dde007b
    timeout-minutes: 180
    # Where the container saw the checkout. CodeChecker's SARIF names files by absolute path, and
    # the upload job, which runs on the runner rather than in the container, relativises them
    # against this.
    outputs:
      analysis_root: ${{ steps.root.outputs.path }}
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - stm32-USB2CAN_NUCLEO_H563ZI
          - stm32-USB2CAN_NUCLEO_H563ZI-mboot
          - mimxrt-USB2CAN_SEEED_ARCH_MIX
          - unix-standard
          - mpy-cross
        include:
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI
            build_dir: src/system/build-USB2CAN_NUCLEO_H563ZI
            fanalyzer: true
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI-mboot
            build_dir: src/system/build-USB2CAN_NUCLEO_H563ZI/mboot
            fanalyzer: true
          - configuration: mimxrt-USB2CAN_SEEED_ARCH_MIX
            build_dir: src/system/build-USB2CAN_SEEED_ARCH_MIX
            fanalyzer: true
          # No -fanalyzer for the host configurations: it needs a pinned GCC 15 host compiler,
          # and the build image's host gcc is 12.2.
          - configuration: unix-standard
            build_dir: src/micropython/ports/unix/build-standard
            fanalyzer: false
          - configuration: mpy-cross
            build_dir: src/micropython/mpy-cross/build
            fanalyzer: false
    env:
      SAST_TOOLS: ${{ vars.SAST_TOOLS }}
      # -fanalyzer does not run on pull requests, so they do not fetch its toolchain.
      SAST_SKIP_ARM_GCC: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - name: Require the analysis tools declaration
        run: |
          if [ -z "$SAST_TOOLS" ]; then
            echo "::error::The repository variable SAST_TOOLS is not set. It is the pip requirement for the degraves-sast package that provides the analysis tools (make sast-tools SAST_TOOLS=...). Without it nothing can be analysed."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build version comes from tags.
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # cppcheck is built from source, and the Arm toolchain and LLVM are large downloads, so all
      # are cached, keyed on their versions and the image they were built in. The cache is saved as
      # soon as the tools are installed, so a later failing step does not discard it.
      - name: Restore the analysis tools
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sast-tools
          key: sast-tools-${{ runner.os }}-${{ env.IMAGE_DIGEST }}-cppcheck-${{ env.CPPCHECK_VERSION }}-arm-gcc-${{ env.SAST_SKIP_ARM_GCC == '1' && 'none'
            || env.ARM_GCC_ANALYZER_VERSION }}-codechecker-${{ env.CODECHECKER_VERSION }}-llvm-${{ env.LLVM_VERSION }}
      - name: Install the analysis tools
        run: make sast-tools
      - name: Save the analysis tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sast-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Record where the checkout is
        id: root
        run: echo "path=$PWD" >> "$GITHUB_OUTPUT"
      - name: Fetch submodules
        run: make submodules
      - name: Build
        run: make build-${{ matrix.configuration }}
      - name: Compilation database
        run: make compile-commands-${{ matrix.configuration }}
      - name: cppcheck
        run: make cppcheck-${{ matrix.configuration }}
      - name: cppcheck coverage
        run: make check-cppcheck-${{ matrix.configuration }}
      - name: CodeChecker
        run: make codechecker-${{ matrix.configuration }}
      - name: CodeChecker coverage
        run: make check-codechecker-${{ matrix.configuration }}
      - name: GCC -fanalyzer (report only)
        if: github.event_name != 'pull_request' && matrix.fanalyzer
        run: make fanalyzer-${{ matrix.configuration }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sast-${{ matrix.configuration }}
          path: |
            ${{ matrix.build_dir }}/sast/compile_commands.json
            ${{ matrix.build_dir }}/sast/cppcheck/*.sarif
            ${{ matrix.build_dir }}/sast/codechecker/results.sarif
            ${{ matrix.build_dir }}/sast/codechecker/reports/metadata.json
            ${{ matrix.build_dir }}/sast/codechecker/reports/failed/
            ${{ matrix.build_dir }}/sast/fanalyzer/

  # cppcheck's MISRA addon over every unit of each configuration, off pull requests, report-only. A job of
  # its own because the addon makes it several times slower than the analysis that gates, and its
  # results stay in its artefact: MISRA over every unit runs to tens of thousands of results, more
  # than code scanning accepts in one run (25,000). The upload does not wait for it.
  misra:
    name: MISRA ${{ matrix.configuration }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: micropython/build-micropython-arm@sha256:0d80e3aaa94bcc5d268d1ec92e3d19865e17d68d3bc9328f0051b5fb0dde007b
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI
            build_dir: src/system/build-USB2CAN_NUCLEO_H563ZI
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI-mboot
            build_dir: src/system/build-USB2CAN_NUCLEO_H563ZI/mboot
          - configuration: mimxrt-USB2CAN_SEEED_ARCH_MIX
            build_dir: src/system/build-USB2CAN_SEEED_ARCH_MIX
          - configuration: unix-standard
            build_dir: src/micropython/ports/unix/build-standard
          - configuration: mpy-cross
            build_dir: src/micropython/mpy-cross/build
    env:
      SAST_TOOLS: ${{ vars.SAST_TOOLS }}
      SAST_SKIP_ARM_GCC: '1'
      SAST_SKIP_CODECHECKER: '1'
    steps:
      - name: Require the analysis tools declaration
        run: |
          if [ -z "$SAST_TOOLS" ]; then
            echo "::error::The repository variable SAST_TOOLS is not set. It is the pip requirement for the degraves-sast package that provides the analysis tools (make sast-tools SAST_TOOLS=...)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Restore the analysis tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sast-tools
          key: sast-tools-${{ runner.os }}-${{ env.IMAGE_DIGEST }}-cppcheck-${{ env.CPPCHECK_VERSION }}-arm-gcc-${{ env.ARM_GCC_ANALYZER_VERSION }}-codechecker-${{
            env.CODECHECKER_VERSION }}-llvm-${{ env.LLVM_VERSION }}
          restore-keys: sast-tools-${{ runner.os }}-${{ env.IMAGE_DIGEST }}-cppcheck-${{ env.CPPCHECK_VERSION }}-
      - name: Install the analysis tools
        run: make sast-tools
      - name: Fetch submodules
        run: make submodules
      - name: Build
        run: make build-${{ matrix.configuration }}
      - name: Compilation database
        run: make compile-commands-${{ matrix.configuration }}
      - name: MISRA (report only)
        run: make misra-${{ matrix.configuration }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: misra-${{ matrix.configuration }}
          path: ${{ matrix.build_dir }}/sast/report/*.sarif
          # The only place MISRA results are kept, so the retention is stated, not inherited.
          retention-days: 90

  # The licence and origin declarations of code copied into this repository (REUSE.toml), checked
  # with the REUSE tool. Separate from the analysis jobs so that a declaration problem does not
  # stop their results being uploaded.
  licences:
    name: Licence declarations
    runs-on: ubuntu-latest
    container: micropython/build-micropython-arm@sha256:0d80e3aaa94bcc5d268d1ec92e3d19865e17d68d3bc9328f0051b5fb0dde007b
    timeout-minutes: 30
    env:
      SAST_TOOLS: ${{ vars.SAST_TOOLS }}
      SAST_SKIP_ARM_GCC: '1'
      SAST_SKIP_CODECHECKER: '1'
    steps:
      - name: Require the analysis tools declaration
        run: |
          if [ -z "$SAST_TOOLS" ]; then
            echo "::error::The repository variable SAST_TOOLS is not set. It is the pip requirement for the degraves-sast package that provides the analysis tools (make sast-tools SAST_TOOLS=...)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'
      - name: Restore the analysis tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sast-tools
          key: sast-tools-${{ runner.os }}-${{ env.IMAGE_DIGEST }}-cppcheck-${{ env.CPPCHECK_VERSION }}-arm-gcc-${{ env.ARM_GCC_ANALYZER_VERSION }}-codechecker-${{
            env.CODECHECKER_VERSION }}-llvm-${{ env.LLVM_VERSION }}
          restore-keys: sast-tools-${{ runner.os }}-${{ env.IMAGE_DIGEST }}-cppcheck-${{ env.CPPCHECK_VERSION }}-
      - name: Install the analysis tools
        run: make sast-tools
      - name: Check the licence declarations
        run: make check-reuse

  # Code scanning takes one run per tool and category per upload, so each configuration's SARIF
  # files, one per compiler-flag group and -fanalyzer unit, are merged per tool
  # with SARIF Multitool first; the results themselves pass through unchanged. This job runs only
  # when every analysis job passed: a partial upload would mark findings in the units that were
  # not analysed as fixed. It is also the only job that can write security events.
  upload:
    name: Upload ${{ matrix.configuration }}
    needs: analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - stm32-USB2CAN_NUCLEO_H563ZI
          - stm32-USB2CAN_NUCLEO_H563ZI-mboot
          - mimxrt-USB2CAN_SEEED_ARCH_MIX
          - unix-standard
          - mpy-cross
        # The port whose own submodules the configuration's build fetched, as `make build-<cfg>`
        # does through src/system; unix-standard and mpy-cross need none beyond make submodules.
        include:
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI
            port_submodules: PORT=stm32 BOARD=USB2CAN_NUCLEO_H563ZI
          - configuration: stm32-USB2CAN_NUCLEO_H563ZI-mboot
            port_submodules: PORT=stm32 BOARD=USB2CAN_NUCLEO_H563ZI
          - configuration: mimxrt-USB2CAN_SEEED_ARCH_MIX
            port_submodules: PORT=mimxrt BOARD=USB2CAN_SEEED_ARCH_MIX
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # upload-sarif computes each result's partialFingerprints from the file the result points
      # at, which is how code scanning keeps tracking an alert when lines around it move. Most
      # results are in submodule files (MicroPython and its libraries), so the job checks out the
      # same submodules the analysis job had; without them those results get no fingerprints.
      - name: Fetch the submodules the analysis read
        run: |
          make submodules
          if [ -n "${{ matrix.port_submodules }}" ]; then
            make -C src/system ${{ matrix.port_submodules }} submodules_
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sast-${{ matrix.configuration }}
          path: sast-in
      - name: Merge SARIF per tool
        run: |
          set -eu
          mkdir -p sast-out
          cppcheck=$(find sast-in -path '*/cppcheck/*.sarif' | sort)
          if [ -z "$cppcheck" ]; then
            echo "::error::No cppcheck SARIF for ${{ matrix.configuration }}."
            exit 1
          fi
          npx --yes @microsoft/sarif-multitool@5.7.0 merge $cppcheck --merge-empty-logs \
            --output-directory sast-out --output-file cppcheck.sarif --log ForceOverwrite
          codechecker=$(find sast-in -path '*/codechecker/results.sarif' | sort)
          if [ -z "$codechecker" ]; then
            echo "::error::No CodeChecker SARIF for ${{ matrix.configuration }}."
            exit 1
          fi
          npx --yes @microsoft/sarif-multitool@5.7.0 merge $codechecker --merge-empty-logs \
            --output-directory sast-out --output-file codechecker.sarif --log ForceOverwrite
          gcc=$(find sast-in -path '*/fanalyzer/*.sarif' | sort)
          if [ -n "$gcc" ]; then
            npx --yes @microsoft/sarif-multitool@5.7.0 merge $gcc --merge-empty-logs \
              --output-directory sast-out --output-file gcc-analyzer.sarif --log ForceOverwrite
          fi
      - uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: sast-out/cppcheck.sarif
          category: cppcheck/${{ matrix.configuration }}
      # CodeChecker names each file by its absolute path in the analysis container. upload-sarif
      # relativises absolute paths against checkout_path, and computes fingerprints from the files
      # under it, so that path is linked to this job's checkout, which holds the same commit and
      # submodules.
      - name: Link the analysis root to this checkout
        env:
          ANALYSIS_ROOT: ${{ needs.analyse.outputs.analysis_root }}
        run: |
          set -eu
          if [ "$ANALYSIS_ROOT" != "$GITHUB_WORKSPACE" ]; then
            sudo mkdir -p "$(dirname "$ANALYSIS_ROOT")"
            sudo ln -sfn "$GITHUB_WORKSPACE" "$ANALYSIS_ROOT"
          fi
      - uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: sast-out/codechecker.sarif
          category: codechecker/${{ matrix.configuration }}
          checkout_path: ${{ needs.analyse.outputs.analysis_root }}
      - uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        if: hashFiles('sast-out/gcc-analyzer.sarif') != ''
        with:
          sarif_file: sast-out/gcc-analyzer.sarif
          category: gcc-analyzer/${{ matrix.configuration }}
