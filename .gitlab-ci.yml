# Compilation-database artefact for SAST-01.
# Generic generation and completeness checking are pinned with MicroPython;
# this job runs the same target-owned recipe developers run locally.

stages:
  - compile-db

compile-commands:
  stage: compile-db
  image: micropython/build-micropython-arm@sha256:0d80e3aaa94bcc5d268d1ec92e3d19865e17d68d3bc9328f0051b5fb0dde007b
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - git config --global --add safe.directory '*'
    - make submodules
  script:
    - make compile-commands
  artifacts:
    paths:
      - src/system/build-USB2CAN_NUCLEO_H563ZI/compile_commands.json
      - src/system/build-USB2CAN_NUCLEO_H563ZI/compile_commands.check.json
      - src/micropython/ports/unix/build-standard/compile_commands.json
      - src/micropython/ports/unix/build-standard/compile_commands.check.json
    expire_in: 1 week

# When GitLab Advanced SAST is enabled for C/C++, it reads this artefact:
#   variables:
#     GITLAB_ADVANCED_SAST_CPP_ENABLED: "true"
#     SAST_COMPILATION_DATABASE: src/system/build-USB2CAN_NUCLEO_H563ZI/compile_commands.json
# SAST-04 wires that scan; this job establishes the verified database prerequisite.
